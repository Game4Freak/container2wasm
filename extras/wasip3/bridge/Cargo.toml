# Bridge component between the emulator core module and the host.
#
# `src/generated.rs` is produced by `wit-bridge-gen` (cmd/wit-bridge-gen)
# from the WIT world of the container. Build with:
#
#   cargo build --release --target wasm32-unknown-unknown
#   wasm-tools component new target/wasm32-unknown-unknown/release/c2w_bridge.wasm -o bridge.wasm
[package]
name = "c2w-bridge"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = { version = "0.63.0", features = ["async-spawn"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc", "float_roundtrip"] }
base64 = { version = "0.22", default-features = false, features = ["alloc"] }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
codegen-units = 1
